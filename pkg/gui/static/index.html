<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ytconv</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="badge">ytconv</span>
      <span id="version" class="dim"></span>
    </div>
    <div class="top-actions">
      <div id="lang" class="lang" role="radiogroup" aria-label="Language / Idioma">
        <button type="button" role="radio" data-lang="pt" aria-checked="false" title="Português">PT</button>
        <button type="button" role="radio" data-lang="en" aria-checked="false" title="English">EN</button>
      </div>
      <button id="quit" class="ghost" type="button" data-i18n="quit" data-i18n-title="quitTitle">Quit</button>
    </div>
  </header>

  <div id="offline" class="banner" hidden data-i18n="offline">ytconv is not running anymore. Start it again to keep downloading.</div>

  <main>
    <section class="card">
      <form id="fetch-form" class="fetch" autocomplete="off">
        <label for="url" class="sr-only" data-i18n="linkLabel">YouTube link</label>
        <input id="url" name="url" type="text" spellcheck="false"
               placeholder="Paste a YouTube video or playlist link" data-i18n-ph="linkPlaceholder" required>
        <button id="fetch" class="primary" type="submit" data-i18n="fetch">Fetch</button>
      </form>
      <p id="fetch-error" class="error" role="alert" hidden></p>
    </section>

    <section id="result" class="card" hidden>
      <div id="video-head" class="video-head" hidden>
        <img id="thumb" alt="" width="192" height="108">
        <div>
          <h1 id="video-title"></h1>
          <p id="video-meta" class="dim"></p>
          <button id="use-list" class="link" type="button" hidden data-i18n="useList">This video is part of a playlist — download the whole playlist instead</button>
        </div>
      </div>

      <div id="list-box" hidden>
        <div class="list-head">
          <div>
            <h1 id="list-title"></h1>
            <p id="list-meta" class="dim"></p>
          </div>
          <div class="list-actions">
            <button id="select-all" class="ghost" type="button" data-i18n="all">All</button>
            <button id="select-none" class="ghost" type="button" data-i18n="none">None</button>
          </div>
        </div>
        <ol id="entries" class="entries"></ol>
      </div>

      <div class="options">
        <div class="field">
          <span class="label" id="format-label" data-i18n="format">Format</span>
          <div id="formats" class="segmented" role="radiogroup" aria-labelledby="format-label"></div>
        </div>

        <label id="h264-row" class="check">
          <input id="h264" type="checkbox">
          <span><span data-i18n="h264">Re-encode video to H.264 so it plays everywhere</span> <span class="dim" data-i18n="h264Note">(slower, needs ffmpeg)</span></span>
        </label>

        <!-- Single video: pick the exact streams. -->
        <div id="quality" class="row">
          <label id="video-q-field" class="field">
            <span class="label" data-i18n="videoQuality">Video quality</span>
            <select id="video-q"></select>
          </label>
          <label id="audio-q-field" class="field">
            <span class="label" data-i18n="audioQuality">Audio quality</span>
            <select id="audio-q"></select>
          </label>
        </div>

        <!-- Playlist: one preset for every video. -->
        <div id="presets" class="row">
          <label id="max-res-field" class="field">
            <span class="label" data-i18n="maxRes">Maximum resolution</span>
            <select id="max-res"></select>
          </label>
          <label id="audio-level-field" class="field">
            <span class="label" data-i18n="audioQuality">Audio quality</span>
            <select id="audio-level"></select>
          </label>
        </div>

        <label id="mp3-field" class="field">
          <span class="label" data-i18n="mp3Bitrate">MP3 bitrate</span>
          <select id="mp3-bitrate"></select>
        </label>
        <p id="quality-hint" class="hint dim"></p>

        <label class="field">
          <span class="label" data-i18n="saveTo">Save to</span>
          <input id="outdir" type="text" spellcheck="false">
        </label>
        <label id="subfolder-row" class="check" hidden>
          <input id="subfolder" type="checkbox" checked>
          <span data-i18n="subfolder">Put the playlist in its own folder</span>
        </label>

        <p id="ffmpeg-warn" class="warn" hidden></p>
        <div class="actions">
          <button id="download" class="primary" type="button" data-i18n="download">Download</button>
          <span id="dl-summary" class="dim"></span>
        </div>
        <p id="dl-error" class="error" role="alert" hidden></p>
      </div>
    </section>

    <section class="queue-section">
      <div class="queue-head">
        <h2><span data-i18n="downloads">Downloads</span> <span id="queue-count" class="dim"></span></h2>
        <div class="queue-actions">
          <button id="cancel-all" class="ghost" type="button" hidden data-i18n="cancelAll">Cancel all</button>
          <button id="clear" class="ghost" type="button" hidden data-i18n="clearFinished">Clear finished</button>
        </div>
      </div>
      <ol id="queue" class="queue"></ol>
      <p id="queue-empty" class="empty dim" data-i18n="queueEmpty">Nothing here yet. Fetch a link above to start.</p>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
